name: Launch Readiness QA

on:
  push:
    branches:
      - phase-1/calculator-correctness
      - phase-2/content-truth-seo
      - phase-3/launch-readiness
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit, content, and technical tests
        run: npm test

      - name: Astro production build
        run: npm run build

      - name: Install browser QA runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/rtc-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rtc-preview.log
          exit 1

      - name: Browser, responsive, accessibility, metadata, and console QA
        run: npx playwright test test/browser-smoke.spec.mjs --reporter=line

      - name: Build ad-enabled simulation
        run: PUBLIC_ADS_ENABLED=true npm run build

      - name: Start ad-enabled preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4322 > /tmp/rtc-ad-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4322/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rtc-ad-preview.log
          exit 1

      - name: Ad-enabled layout simulation
        env:
          RTC_BASE_URL: http://127.0.0.1:4322
        run: npx playwright test test/ad-enabled.spec.mjs --reporter=line
