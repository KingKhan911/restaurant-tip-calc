name: Launch Readiness QA

on:
  push:
    branches:
      - phase-1/calculator-correctness
      - phase-2/content-truth-seo
      - phase-3/launch-readiness
      - phase-4/audit-corrections
      - phase-4.2/ad-placeholders-default
      - phase-4.3/responsive-ad-rail
      - phase-4.4/delivery-quick-answer
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit, content, and technical tests
        run: npm test

      - name: Astro production build
        run: npm run build

      - name: Audit built output
        run: npm run test:dist

      - name: Install browser QA runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Start built preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/rtc-preview.log 2>&1 &
          echo $! > /tmp/rtc-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rtc-preview.log
          exit 1

      - name: Browser, responsive, accessibility, metadata, and console QA
        run: npx playwright test test/browser-smoke.spec.mjs --reporter=line

      - name: Default placeholder layout QA
        env:
          RTC_BASE_URL: http://127.0.0.1:4321
        run: npx playwright test test/ad-enabled.spec.mjs --reporter=line

      - name: Capture visual QA set and performance metrics
        run: node test/visual-capture.mjs

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-visual-qa-${{ github.sha }}
          path: visual-qa/
          retention-days: 1
          if-no-files-found: error

      - name: Upload default placeholder visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-default-ad-visual-qa-${{ github.sha }}
          path: visual-qa/ad-enabled--*.jpg
          retention-days: 1
          if-no-files-found: error

      - name: Stop default preview
        if: always()
        run: npx astro preview stop || true

      - name: Build explicit ads-disabled state
        run: PUBLIC_ADS_ENABLED=false npm run build

      - name: Audit explicit ads-disabled built output
        run: npm run test:dist

      - name: Start ads-disabled preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4322 --force > /tmp/rtc-ad-disabled-preview.log 2>&1 &
          echo $! > /tmp/rtc-ad-disabled-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4322/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rtc-ad-disabled-preview.log
          exit 1

      - name: Explicit ads-disabled layout regression
        env:
          RTC_BASE_URL: http://127.0.0.1:4322
        run: npx playwright test test/ad-disabled.spec.mjs --reporter=line

      - name: Stop ads-disabled preview
        if: always()
        run: npx astro preview stop || true
